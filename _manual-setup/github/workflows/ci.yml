name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Bundle size
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          for f in packages/core/dist/index.js packages/renderer/dist/index.js; do
            raw=$(wc -c < "$f"); gz=$(gzip -c "$f" | wc -c)
            echo "- \`$f\`: ${raw} B (gzip ${gz} B)" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: playground-dist
          path: apps/playground/dist
          retention-days: 7
